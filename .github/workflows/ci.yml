name: CI Pipelines

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # #173 — run root-level jest suite
  test-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./package-lock.json"
      - run: npm ci
      - run: npm test

  test-and-build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"
      - run: npm ci
      - name: Lint frontend
        run: npm run lint
      # #175 — gate on high-severity vulnerabilities in frontend dependencies
      - name: Audit frontend dependencies (high gate)
        run: npm audit --audit-level=high
      - run: npm run build

  test-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agent
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./agent/package-lock.json"
      - run: npm ci
      # #176 — gate on high-severity vulnerabilities in agent dependencies
      - name: Audit agent dependencies (high gate)
        run: npm audit --audit-level=high
      - run: npm test --ignore-scripts

  build-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo build --target wasm32-unknown-unknown
      - run: cargo test
